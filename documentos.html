<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentos — Liga Lombarda</title>

    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="shortcut icon" href="./logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* =========================================================
           VARIABLES Y RESET
        ========================================================= */
        :root {
            --black: #151515;
            --dark: #24201c;
            --paper: #eee4ce;
            --paper-light: #f7f0df;
            --paper-dark: #ded0b5;
            --red: #76251c;
            --red-dark: #501812;
            --gold: #a4864a;
            --border: #332c24;
            --gray: #81796c;

            --bg-body: #f4f4f5;
            --bg-dark: #0d0d0d;
            --bg-card: #ffffff;
            --text-dark: #1f1f1f;
            --text-light: #ffffff;
            --gold-bright: #ffd700;
            --gold-soft: #e6c15a;
            --red-slide: #990024;
            --purple: #7b1fa2;
            --purple-dark: #5c1578;

            /* Colores por rango */
            --color-elite: #FFD700;
            --color-caballero: #CC0000;
            --color-infante: #933581;
            --color-paladin: #855C88;
            --color-pavesero: #028589;
            --color-milicia: #BC4E00;
            --color-ballestero: #10A1C3;
            --color-ciudadano: #888888;

            --header-height: 64px;
            --botones-height: 52px;
            --slide-top-padding: calc(var(--botones-height) + 30px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Libre Baskerville", Georgia, serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================================================
           OVERLAY DE AUTENTICACIÓN
        ========================================================= */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(8px);
        }

        .auth-overlay.hidden {
            display: none;
        }

        .auth-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #4a3d2e;
            border-top: 4px solid #a4864a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .auth-overlay p {
            color: #b7a98f;
            font-family: "Cinzel", serif;
            font-size: 14px;
            letter-spacing: 2px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* =========================================================
           CONTENIDO PRINCIPAL (oculto hasta autenticar)
        ========================================================= */
        #mainContent {
            display: none;
        }

        #mainContent.visible {
            display: block;
        }

        /* =========================================================
           HEADER FIJO
        ========================================================= */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background: #0d0d0d;
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            border-bottom: 2px solid #222;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 34px;
            height: auto;
        }

        .brand h1 {
            font-family: "Cinzel", serif;
            font-size: 16px;
            letter-spacing: 2px;
            color: var(--paper);
        }

        nav {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            position: relative;
            color: #888888;
            text-decoration: none;
            font-family: "Montserrat", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 8px 12px;
            transition: color 0.3s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform: translateX(-50%);
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        nav a:hover {
            color: #ffffff;
        }

        nav a:hover::after {
            width: 60%;
        }

        nav a.active {
            color: #ffffff;
        }

        nav a.active::after {
            width: 100%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* =========================================================
           USER INFO EN EL HEADER
        ========================================================= */
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info .email {
            color: #b7a98f;
            font-size: 10px;
            font-family: "Montserrat", sans-serif;
        }

        .user-info .email i {
            color: var(--gold-bright);
            margin-right: 4px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #4a3d2e;
            color: #b7a98f;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: "Montserrat", sans-serif;
            font-size: 9px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: var(--red-slide);
            border-color: var(--red-slide);
            color: white;
        }

        /* =========================================================
           TOAST
        ========================================================= */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 14px 28px;
            border-radius: 8px;
            font-family: "Cinzel", serif;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
        }

        .toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: rgba(26, 74, 42, 0.95);
            color: #b8e0b8;
            border: 1px solid #2a6a3a;
        }

        .toast.error {
            background: rgba(74, 26, 26, 0.95);
            color: #e0b8b8;
            border: 1px solid #6a2a2a;
        }

        .toast.info {
            background: rgba(26, 42, 74, 0.95);
            color: #b8c8e0;
            border: 1px solid #2a3a6a;
        }

        /* =========================================================
           BOTONES FLOTANTES
        ========================================================= */
        .botones-container {
            position: fixed;
            top: calc(var(--header-height) + 12px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1100;
            height: var(--botones-height);
            align-items: center;
        }

        .btn {
            padding: 10px 22px;
            font-size: clamp(11px, 3vw, 13px);
            font-weight: 700;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
            font-family: 'Montserrat', sans-serif;
            color: white;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: scale(0.96);
        }

        #btn-izquierda {
            background-color: var(--red-slide);
        }

        #btn-derecha {
            background-color: var(--purple);
        }

        #btn-izquierda.active,
        #btn-derecha.active {
            box-shadow: 0 0 0 2px #ffffff, 0 0 16px rgba(255, 255, 255, 0.5);
        }

        /* =========================================================
           VIEWPORT — CRECE CON EL CONTENIDO
        ========================================================= */
        .viewport {
            position: relative;
            width: 100%;
            margin-top: var(--header-height);
            overflow: hidden;
            transition: height 0.3s ease;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: calc(100vh - var(--header-height));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: var(--slide-top-padding) 5% 80px;
            background-color: var(--bg-body);
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            will-change: transform;
        }

        #slide-1 {
            transform: translateX(0%);
            z-index: 2;
        }

        #slide-2 {
            transform: translateX(100%);
            z-index: 1;
        }

        .viewport.slide2-active #slide-1 {
            transform: translateX(-100%);
            z-index: 1;
        }

        .viewport.slide2-active #slide-2 {
            transform: translateX(0%);
            z-index: 2;
        }

        /* =========================================================
           CÍRCULOS FLOTANTES
        ========================================================= */
        .circle {
            position: absolute;
            border-radius: 50%;
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .color-vino {
            background-color: #b3002a;
        }

        .color-morado {
            background-color: #9c27b0;
        }

        .c-large {
            width: clamp(80px, 14vw, 150px);
            aspect-ratio: 1;
        }

        .c-medium {
            width: clamp(55px, 9vw, 100px);
            aspect-ratio: 1;
        }

        .c-small {
            width: clamp(35px, 6vw, 65px);
            aspect-ratio: 1;
        }

        .s1-c1 { top: 3%; left: 8%; animation-delay: 0s; }
        .s1-c2 { top: 12%; left: 3%; animation-delay: 1.2s; }
        .s1-c3 { top: 6%; left: 28%; animation-delay: 2.4s; }
        .s1-c4 { top: 18%; right: 10%; animation-delay: 0.8s; }
        .s1-c5 { top: 30%; left: 12%; animation-delay: 1.8s; }

        .s2-c1 { top: 3%; right: 8%; animation-delay: 0s; }
        .s2-c2 { top: 12%; right: 3%; animation-delay: 1.2s; }
        .s2-c3 { top: 6%; right: 28%; animation-delay: 2.4s; }
        .s2-c4 { top: 18%; left: 10%; animation-delay: 0.8s; }
        .s2-c5 { top: 30%; right: 12%; animation-delay: 1.8s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
        }

        /* =========================================================
           FONDO CURVADO — SE ESTIRA HASTA ABAJO DEL SLIDE
        ========================================================= */
        .card-content-bg {
            position: absolute;
            left: 0;
            width: 100%;
            top: 38vh;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
        }

        .card-content-1 {
            background-color: var(--red-slide);
            border-top-left-radius: clamp(400px, 40vw, 600px);
            box-shadow: -5px -5px 20px rgba(0, 0, 0, 0.08);
        }

        .card-content-2 {
            background-color: var(--purple);
            border-top-right-radius: clamp(400px, 40vw, 600px);
            box-shadow: 5px -5px 20px rgba(0, 0, 0, 0.08);
        }

        /* =========================================================
           CONTENIDO PRINCIPAL
        ========================================================= */
        .main-container {
            width: min(1300px, 100%);
            position: relative;
            z-index: 10;
        }

        /* =========================================================
           ANIMACIONES DE ENTRADA
        ========================================================= */
        .anim-item {
            opacity: 0;
            transform: translateY(24px);
            animation: fadeInUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        .anim-item:nth-child(1) { animation-delay: 0.05s; }
        .anim-item:nth-child(2) { animation-delay: 0.15s; }
        .anim-item:nth-child(3) { animation-delay: 0.25s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================================
           TÍTULO DE PÁGINA
        ========================================================= */
        .page-title {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding: 22px 26px;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 8px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            backdrop-filter: blur(6px);
        }

        .page-title::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
            opacity: 0.6;
        }

        .page-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .page-title .title-main {
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-light);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .page-title .title-main i {
            color: var(--gold-bright);
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
            font-size: 22px;
        }

        .page-title .title-sub {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
            text-transform: uppercase;
        }

        .page-title.purple {
            border-color: rgba(156, 39, 176, 0.45);
        }

        .page-title.purple .title-main i {
            color: #ce93d8;
            filter: drop-shadow(0 0 8px rgba(206, 147, 216, 0.5));
        }

        /* =========================================================
           FILTRO DE BÚSQUEDA
        ========================================================= */
        .search-bar {
            position: relative;
            display: flex;
            gap: 16px;
            margin-bottom: 36px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 16px 20px;
            align-items: center;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 6px 24px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(6px);
        }

        .search-bar.purple {
            border-color: rgba(156, 39, 176, 0.3);
        }

        .search-bar .search-icon {
            position: absolute;
            left: 34px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            pointer-events: none;
            transition: color 0.3s;
        }

        .search-bar input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            padding: 12px 18px 12px 42px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            outline: none;
            min-width: 200px;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            border-color: var(--gold-soft);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.15);
        }

        .search-bar.purple input:focus {
            border-color: #ce93d8;
            box-shadow: 0 0 0 3px rgba(156, 39, 176, 0.2);
        }

        .search-bar:focus-within .search-icon {
            color: var(--gold-bright);
        }

        .search-bar.purple:focus-within .search-icon {
            color: #ce93d8;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }

        .search-bar .filter-count {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            font-family: "Montserrat", sans-serif;
            white-space: nowrap;
        }

        .search-bar .filter-count span {
            color: var(--gold-bright);
            font-weight: 700;
        }

        /* =========================================================
           CONTENEDOR POR RANGO
        ========================================================= */
        .rank-section {
            margin-bottom: 48px;
            animation: fadeInUp 0.5s ease both;
        }

        .rank-section:last-child {
            margin-bottom: 0;
        }

        .rank-section-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            padding: 0 4px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            position: relative;
        }

        .rank-section-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, var(--rank-color, #fff), transparent);
            border-radius: 2px;
        }

        .rank-section-header .rank-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 0 12px currentColor;
        }

        .rank-section-header .rank-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid currentColor;
            opacity: 0.35;
        }

        .rank-section-header .rank-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-light);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }

        .rank-section-header .rank-count {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            margin-left: auto;
            padding: 5px 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            text-transform: uppercase;
        }

        /* =========================================================
           GRID DE TARJETAS
        ========================================================= */
        .rank-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }

        /* =========================================================
           TARJETA INDIVIDUAL
        ========================================================= */
        .document-card {
            background: var(--bg-card);
            border: 1px solid #d0d0d0;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
                        box-shadow 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
                        border-color 0.35s ease;
            cursor: pointer;
            position: relative;
            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.2),
                inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            z-index: 1;
            animation: cardIn 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .document-card::before {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            pointer-events: none;
            z-index: 2;
            transition: border-color 0.3s;
        }

        .document-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 215, 0, 0.4),
                inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            z-index: 10;
        }

        .document-card:hover::before {
            border-color: rgba(255, 215, 0, 0.4);
        }

        .document-card .corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: rgba(0, 0, 0, 0.25);
            z-index: 3;
            pointer-events: none;
            transition: border-color 0.3s;
        }

        .document-card .corner.tl { top: 8px; left: 8px; border-top: 2px solid; border-left: 2px solid; }
        .document-card .corner.tr { top: 8px; right: 8px; border-top: 2px solid; border-right: 2px solid; }
        .document-card .corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid; border-left: 2px solid; }
        .document-card .corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid; border-right: 2px solid; }

        .document-card:hover .corner {
            border-color: rgba(255, 215, 0, 0.6);
        }

        .document-card .rank-badge {
            display: inline-block;
            font-size: 7px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 4px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            color: #1a1a1a;
            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .document-card[data-rank="Elite Urbana"] .rank-badge { background: var(--color-elite); color: #1a1a1a; }

        .document-card[data-rank="Milicia Urbana"] .rank-badge { background: var(--color-milicia); color: white; }
        .document-card[data-rank="Ballestero Genovés Condecorado"] .rank-badge { background: var(--color-ballestero); color: white; }
        .document-card[data-rank="Ciudadano"] .rank-badge { background: var(--color-ciudadano); color: white; }

        .card-skin {
            width: 100%;
            aspect-ratio: 1 / 0.9;
            background: radial-gradient(ellipse at 50% 30%, #fdfdfd 0%, #e8e8e8 70%, #d5d5d5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px 12px 0 0;
        }

        .card-skin::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top,
                #fdfdfd 0%,
                rgba(253, 253, 253, 0.95) 15%,
                rgba(253, 253, 253, 0.75) 35%,
                rgba(253, 253, 253, 0.35) 60%,

            pointer-events: none;
            z-index: 2;
            border-radius: 0 0 12px 12px;
        }

        .card-skin canvas {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
            object-fit: contain;
            position: relative;
            z-index: 1;
            transform-origin: center center;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-radius: 12px 12px 0 0;

        .document-card:hover .card-skin canvas {

    <div id="toast" class="toast"></div>

    <!-- =========================================================

    <!-- =========================================================
         SCRIPTS (módulo ES)
    ========================================================= -->
    <script type="module">
        // =========================================================
        // IMPORTS DE FIREBASE
        // =========================================================
        import {
            auth,
            onAuthStateChanged,
            signOut,
            database,
            ref,
            get,
            onValue
        } from "./firebase-init.js";

        // Exponer Firebase para compatibilidad
        window.firebaseDB = database;
        window.firebaseRef = ref;
        window.firebaseGet = get;
        window.firebaseOnValue = onValue;

        // =========================================================
        // REFERENCIAS DOM
        // =========================================================
        const authOverlay = document.getElementById('authOverlay');
        const mainContent = document.getElementById('mainContent');
        const userNav = document.getElementById('userNav');
        const toast = document.getElementById('toast');
        const documentsContainer = document.getElementById('documentsContainer');
        const inmigrantesContainer = document.getElementById('inmigrantesContainer');
        const searchInput = document.getElementById('searchInput');
        const searchInput2 = document.getElementById('searchInput2');
        const viewport = document.getElementById('viewport');
        const btnIzq = document.getElementById('btn-izquierda');
        const btnDer = document.getElementById('btn-derecha');
        const slide1 = document.getElementById('slide-1');
        const slide2 = document.getElementById('slide-2');
        const visibleCount = document.getElementById('visibleCount');
        const totalVisible = document.getElementById('totalVisible');

        // =========================================================
        // TOAST
        // =========================================================
        function showToast(message, type = 'info', duration = 4000) {
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }
        window.showToast = showToast;

        // =========================================================
        // AJUSTAR ALTURA DEL VIEWPORT
        // =========================================================
        function ajustarAlturaViewport() {
            const slideActivo = viewport.classList.contains('slide2-active') ? slide2 : slide1;
            const alturaContenido = slideActivo.scrollHeight;
            const alturaMinima = window.innerHeight - parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-height')) || 0;
            viewport.style.height = Math.max(alturaContenido, alturaMinima) + 'px';
        }

        const resizeObserver = new ResizeObserver(() => {
            ajustarAlturaViewport();
        });
        resizeObserver.observe(slide1);
        resizeObserver.observe(slide2);
        window.addEventListener('resize', ajustarAlturaViewport);

        // =========================================================
        // NAVEGACIÓN ENTRE SLIDES
        // =========================================================
        function moverIzquierda() {
            viewport.classList.remove('slide2-active');
            btnIzq.classList.add('active');
            btnDer.classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(ajustarAlturaViewport, 50);
        }

        function moverDerecha() {
            viewport.classList.add('slide2-active');
            btnDer.classList.add('active');
            btnIzq.classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(ajustarAlturaViewport, 50);
        }

        window.moverIzquierda = moverIzquierda;
        window.moverDerecha = moverDerecha;

        // =========================================================
        // RENDERIZAR NAV
        // =========================================================
        function renderNav(user, isAdmin = false) {
            if (user) {
                userNav.style.display = 'flex';
                userNav.innerHTML = `
                    <span class="user-info">
                        <span class="email">
                            <i class="fas fa-user-circle"></i> ${user.email}
                            ${isAdmin ? '<span style="color:var(--gold-bright);margin-left:4px;">👑</span>' : ''}
                        </span>
                        <button class="logout-btn" id="logoutBtnNav">
                            <i class="fas fa-sign-out-alt"></i> SALIR
                        </button>
                    </span>
                `;
                document.getElementById('logoutBtnNav').addEventListener('click', handleLogout);
            }
        }

        // =========================================================
        // VERIFICAR ADMIN
        // =========================================================
        async function checkIsAdmin(user) {
            if (!user) return false;
            try {
                const adminRef = ref(database, `usuarios/${user.uid}/admin`);
                const snapshot = await get(adminRef);
                return snapshot.val() === true;
            } catch (error) {
                console.warn('No se pudo verificar rol de admin:', error);
                return false;
            }
        }

        // =========================================================
        // LOGOUT
        // =========================================================
        async function handleLogout() {
            try {
                await signOut(auth);
                showToast('👋 Sesión cerrada correctamente', 'info', 2000);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 500);
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
                showToast('❌ Error al cerrar sesión', 'error', 3000);
            }
        }

        // =========================================================
        // ORDEN DE RANGOS
        // =========================================================
        const RANK_ORDER = [
            'Elite Urbana',
            'Caballero Lombardo',
            'Infante Lombardo',
            'Paladín Lombardo',
            'Pavesero Lombardo',
            'Milicia Urbana',
            'Ballestero Genovés Condecorado',
            'Ciudadano'
        ];

        const RANK_COLORS = {
            'Elite Urbana': '#FFD700',
            'Caballero Lombardo': '#CC0000',
            'Infante Lombardo': '#933581',
            'Paladín Lombardo': '#855C88',
            'Pavesero Lombardo': '#028589',
            'Milicia Urbana': '#BC4E00',
            'Ballestero Genovés Condecorado': '#10A1C3',
            'Ciudadano': '#888888'
        };

        const POSES = [
            { rotY: 0.4, rotX: 0.1, zoom: 0.95, offsetX: 0, offsetY: 0 },
            { rotY: -0.6, rotX: 0.15, zoom: 0.9, offsetX: 0.05, offsetY: 0 },
            { rotY: 0.8, rotX: -0.1, zoom: 1.0, offsetX: -0.05, offsetY: 0 },
            { rotY: 0.1, rotX: 0.25, zoom: 0.85, offsetX: 0, offsetY: 0.05 },
            { rotY: -0.3, rotX: -0.15, zoom: 1.05, offsetX: 0.03, offsetY: -0.03 },
            { rotY: 0.5, rotX: 0.2, zoom: 0.88, offsetX: -0.04, offsetY: 0.04 },
            { rotY: -0.8, rotX: 0.0, zoom: 1.0, offsetX: 0.06, offsetY: 0 },
            { rotY: 0.9, rotX: 0.1, zoom: 0.92, offsetX: -0.06, offsetY: 0 },
            { rotY: 0.0, rotX: 0.35, zoom: 0.82, offsetX: 0, offsetY: 0.08 }
        ];

        // =========================================================
        // CARGAR SKIN EN CANVAS
        // =========================================================
        function cargarSkinEnCanvas(canvas, skinURL, poseIndex = 0) {
            if (typeof skinview3d === 'undefined') {
                setTimeout(() => cargarSkinEnCanvas(canvas, skinURL, poseIndex), 300);
                return;
            }

            try {
                const viewer = new skinview3d.SkinViewer({
                    canvas: canvas,
                    width: 300,
                    height: 270
                });

                viewer.fov = 30;
                viewer.autoRotate = false;
                viewer.controls.enableRotate = false;
                viewer.controls.enableZoom = false;
                viewer.controls.enablePan = false;
                viewer.globalLight.intensity = 2.5;
                viewer.cameraLight.intensity = 1.2;

                const pose = POSES[poseIndex % POSES.length];

                viewer.zoom = pose.zoom;
                viewer.camera.rotation.y = pose.rotY;
                viewer.camera.rotation.x = pose.rotX;
                viewer.camera.position.x = pose.offsetX * 10;
                viewer.camera.position.y = pose.offsetY * 10;

                viewer.controls.target.set(0, 0, 0);

                viewer.loadSkin(skinURL).catch(() => {
                    console.warn('Error cargando skin para:', skinURL);
                });

            } catch (error) {
                console.warn('Error al renderizar skin:', error);
            }
        }

        // =========================================================
        // VER EXPEDIENTE
        // =========================================================
        function verExpediente(id) {
            window.location.href = `expediente.html?id=${id}`;
        }
        window.verExpediente = verExpediente;

        // =========================================================
        // RENDERIZAR CIUDADANOS (LIGA LOMBARDA)
        // =========================================================
        function renderizarCiudadanos(expedientes, searchTerm = '') {
            const searchLower = searchTerm.toLowerCase().trim();

            let items = Object.keys(expedientes).map(key => ({
                id: key,
                ...expedientes[key]
            }));

            // Filtrar solo los que NO son inmigrantes (categoria distinta a 'inmigrante')
            items = items.filter(item => item.categoria !== 'inmigrante');

            // Filtrar por búsqueda
            if (searchLower) {
                items = items.filter(item => {
                    const name = (item.name || '').toLowerCase();
                    const alias = (item.alias || '').toLowerCase();
                    const nick = (item.minecraftNick || '').toLowerCase();
                    const rank = (item.rank || '').toLowerCase();
                    const fileNumber = (item.fileNumber || '').toLowerCase();
                    return name.includes(searchLower) ||
                        alias.includes(searchLower) ||
                        nick.includes(searchLower) ||
                        rank.includes(searchLower) ||
                        fileNumber.includes(searchLower);
                });
            }

            // Agrupar por rango
            const grupos = {};
            items.forEach(item => {
                const rank = item.rank || 'Ciudadano';
                if (!grupos[rank]) grupos[rank] = [];
                grupos[rank].push(item);
            });

            const rangosOrdenados = RANK_ORDER.filter(r => grupos[r] && grupos[r].length > 0);

            // Actualizar contadores
            visibleCount.textContent = items.length;
            totalVisible.textContent = items.length;

            if (items.length === 0) {
                documentsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-address-book"></i>
                        <h3>${searchLower ? 'No se encontraron resultados' : 'No hay expedientes registrados'}</h3>
                        <p>${searchLower ? 'Intenta con otro término de búsqueda' : 'Completa el formulario para crear el primer expediente'}</p>
                    </div>
                `;
                setTimeout(ajustarAlturaViewport, 100);
                return;
            }

            let html = '';
            let poseCounter = 0;
            let cardIndex = 0;

            rangosOrdenados.forEach(rank => {
                const itemsDelRango = grupos[rank];
                const color = RANK_COLORS[rank] || '#888888';

                html += `
                    <div class="rank-section" style="--rank-color:${color};">
                        <div class="rank-section-header">
                            <span class="rank-dot" style="background:${color};color:${color};"></span>
                            <span class="rank-label">${rank}</span>
                            <span class="rank-count">${itemsDelRango.length} ciudadano${itemsDelRango.length > 1 ? 's' : ''}</span>
                        </div>
                        <div class="rank-grid">
                `;

                itemsDelRango.forEach(item => {
                    const name = item.name || 'Sin nombre';
                    const alias = item.alias || 'Sin alias';
                    const nick = item.minecraftNick || '';

                    const skinURL = nick ? `https://mc-heads.net/skin/${encodeURIComponent(nick)}.png` : null;
                    const currentPose = poseCounter % POSES.length;
                    poseCounter++;

                    const delay = (cardIndex * 0.04).toFixed(2);
                    cardIndex++;

                    html += `
                        <div class="document-card" data-rank="${rank}" data-id="${item.id}" style="animation-delay:${delay}s;">
                            <span class="corner tl"></span>
                            <span class="corner tr"></span>
                            <span class="corner bl"></span>
                            <span class="corner br"></span>
                            <div class="card-skin">
                                ${skinURL ?
                                    `<canvas id="skinCanvas_${item.id}" data-skin="${skinURL}" data-pose="${currentPose}"></canvas>` :
                                    `<div class="no-skin"><i class="fas fa-user"></i></div>`
                                }
                            </div>
                            <div class="card-info">
                                <div class="card-name">${name}</div>
                                <div class="card-alias">"${alias}"</div>
                                <div class="card-rank">
                                    <span class="rank-badge">${rank}</span>
                                </div>
                                <div class="card-actions">
                                    <button class="btn-view" onclick="verExpediente('${item.id}')">
                                        <i class="fas fa-eye"></i> VER
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            documentsContainer.innerHTML = html;

            setTimeout(() => {
                document.querySelectorAll('.card-skin canvas').forEach(canvas => {
                    const skinURL = canvas.dataset.skin;
                    const poseIndex = parseInt(canvas.dataset.pose || '0', 10);
                    if (skinURL) {
                        cargarSkinEnCanvas(canvas, skinURL, poseIndex);
                    }
                });
                ajustarAlturaViewport();
            }, 200);
        }

        // =========================================================
        // RENDERIZAR INMIGRANTES (SLIDE 2)
        // =========================================================
        function renderizarInmigrantes(expedientes, searchTerm = '') {
            const searchLower = searchTerm.toLowerCase().trim();

            let items = Object.keys(expedientes).map(key => ({
                id: key,
                ...expedientes[key]
            }));

            // Filtrar solo los que SÍ son inmigrantes (categoria === 'inmigrante')
            items = items.filter(item => item.categoria === 'inmigrante');

            if (searchLower) {
                items = items.filter(item => {
                    const name = (item.name || '').toLowerCase();
                    const alias = (item.alias || '').toLowerCase();
                    const nick = (item.minecraftNick || '').toLowerCase();
                    const rank = (item.rank || '').toLowerCase();
                    const fileNumber = (item.fileNumber || '').toLowerCase();
                    return name.includes(searchLower) ||
                        alias.includes(searchLower) ||
                        nick.includes(searchLower) ||
                        rank.includes(searchLower) ||
                        fileNumber.includes(searchLower);
                });
            }

            if (items.length === 0) {
                inmigrantesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-passport"></i>
                        <h3>${searchLower ? 'No se encontraron resultados' : 'No hay inmigrantes registrados'}</h3>
                        <p>${searchLower ? 'Intenta con otro término de búsqueda' : 'Los registros de inmigrantes aparecerán aquí'}</p>
                    </div>
                `;
                setTimeout(ajustarAlturaViewport, 100);
                return;
            }

            // Renderizar en un solo grid (sin agrupar por rango, o puedes agrupar si quieres)
            let html = `<div class="rank-grid">`;
            let cardIndex = 0;

            items.forEach(item => {
                const name = item.name || 'Sin nombre';
                const alias = item.alias || 'Sin alias';
                const nick = item.minecraftNick || '';
                const rank = item.rank || 'Inmigrante';

                const skinURL = nick ? `https://mc-heads.net/skin/${encodeURIComponent(nick)}.png` : null;
                const delay = (cardIndex * 0.04).toFixed(2);
                cardIndex++;

                html += `
                    <div class="document-card" data-rank="${rank}" data-id="${item.id}" style="animation-delay:${delay}s;">
                        <span class="corner tl"></span>
                        <span class="corner tr"></span>
                        <span class="corner bl"></span>
                        <span class="corner br"></span>
                        <div class="card-skin">
                            ${skinURL ?
                                `<canvas data-skin="${skinURL}"></canvas>` :
                                `<div class="no-skin"><i class="fas fa-user"></i></div>`
                            }
                        </div>
                        <div class="card-info">
                            <div class="card-name">${name}</div>
                            <div class="card-alias">"${alias}"</div>
                            <div class="card-rank">
                                <span class="rank-badge" style="background:#7b1fa2;color:white;">${rank}</span>
                            </div>
                            <div class="card-actions">
                                <button class="btn-view" onclick="verExpediente('${item.id}')">
                                    <i class="fas fa-eye"></i> VER
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            inmigrantesContainer.innerHTML = html;

            setTimeout(() => {
                inmigrantesContainer.querySelectorAll('.card-skin canvas').forEach(canvas => {
                    const skinURL = canvas.dataset.skin;
                    if (skinURL) {
                        cargarSkinEnCanvas(canvas, skinURL, 0);
                    }
                });
                ajustarAlturaViewport();
            }, 200);
        }

        // =========================================================
        // CARGAR DOCUMENTOS DESDE FIREBASE
        // =========================================================
        let expedientesGlobales = {};

        function cargarDocumentos() {
            const expedientesRef = ref(database, 'expedientes');

            onValue(expedientesRef, (snapshot) => {
                expedientesGlobales = snapshot.val() || {};

                // Renderizar ambas pestañas
                renderizarCiudadanos(expedientesGlobales, searchInput.value);
                renderizarInmigrantes(expedientesGlobales, searchInput2.value);

            }, (error) => {
                console.error('Error al cargar documentos:', error);
                showToast('❌ Error al cargar los documentos', 'error', 3000);
            });
        }

        // =========================================================
        // BÚSQUEDA EN TIEMPO REAL
        // =========================================================
        let searchTimeout = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderizarCiudadanos(expedientesGlobales, searchInput.value);
                ajustarAlturaViewport();
            }, 300);
        });

        let searchTimeout2 = null;
        searchInput2.addEventListener('input', () => {
            clearTimeout(searchTimeout2);
            searchTimeout2 = setTimeout(() => {
                renderizarInmigrantes(expedientesGlobales, searchInput2.value);
                ajustarAlturaViewport();
            }, 300);
        });

        // =========================================================
        // OBSERVER DE AUTENTICACIÓN
        // =========================================================
        onAuthStateChanged(auth, async (user) => {
            // Ocultar overlay
            authOverlay.classList.add('hidden');

            if (!user) {
                showToast('🔐 Debes iniciar sesión para ver los documentos', 'error', 2000);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 500);
                return;
            }

            const isAdmin = await checkIsAdmin(user);
            mainContent.classList.add('visible');
            renderNav(user, isAdmin);
            cargarDocumentos();
            showToast(`✅ Bienvenido, ${user.email}`, 'success', 2000);

            console.log(`📄 Documentos - Usuario: ${user.email}`);
            console.log(`👑 Rol: ${isAdmin ? 'admin' : 'normal'}`);
        });

        console.log('📄 Página de documentos con autenticación obligatoria');
    </script>

</body>
</html>
