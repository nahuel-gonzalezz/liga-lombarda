<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentos — Liga Lombarda</title>

    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="shortcut icon" href="./logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* =========================================================
           VARIABLES Y RESET
        ========================================================= */
        :root {
            --black: #151515;
            --dark: #24201c;
            --paper: #eee4ce;
            --paper-light: #f7f0df;
            --paper-dark: #ded0b5;
            --red: #76251c;
            --red-dark: #501812;
            --gold: #a4864a;
            --border: #332c24;
            --gray: #81796c;
            
            /* Colores por rango */
            --color-elite: #FFD700;
            --color-caballero: #CC0000;
            --color-infante: #933581;
            --color-paladin: #855C88;
            --color-pavesero: #028589;
            --color-milicia: #BC4E00;
            --color-ballestero: #10A1C3;
            --color-ciudadano: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top, #3a342e, #171717 70%);
            color: white;
            font-family: "Libre Baskerville", Georgia, serif;
            min-height: 100vh;
        }

        /* =========================================================
           OVERLAY DE AUTENTICACIÓN
        ========================================================= */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(8px);
        }

        .auth-overlay.hidden {
            display: none;
        }

        .auth-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #4a3d2e;
            border-top: 4px solid #a4864a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .auth-overlay p {
            color: #b7a98f;
            font-family: "Cinzel", serif;
            font-size: 14px;
            letter-spacing: 2px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* =========================================================
           CONTENIDO PRINCIPAL (oculto hasta autenticar)
        ========================================================= */
        #mainContent {
            display: none;
        }

        #mainContent.visible {
            display: block;
        }

        /* =========================================================
           HEADER
        ========================================================= */
        header {
            width: 100%;
            height: 75px;
            background: rgba(18, 17, 15, 0.95);
            border-bottom: 1px solid #4a3d2e;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-inner {
            width: min(1100px, 90%);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 35px;
        }

        .brand h1 {
            font-family: "Cinzel", serif;
            font-size: 18px;
            letter-spacing: 2px;
            color: var(--paper);
        }

        nav {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            color: #c7b99d;
            text-decoration: none;
            font-family: "Montserrat", sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 8px 12px;
            transition: 0.2s;
        }

        nav a:hover {
            color: var(--gold);
        }

        nav a.active {
            color: var(--gold);
            border-bottom: 2px solid var(--gold);
        }

        /* =========================================================
           USER INFO EN EL HEADER
        ========================================================= */
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info .email {
            color: #b7a98f;
            font-size: 10px;
            font-family: "Montserrat", sans-serif;
        }

        .user-info .email i {
            color: var(--gold);
            margin-right: 4px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #4a3d2e;
            color: #b7a98f;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: "Montserrat", sans-serif;
            font-size: 9px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: var(--red);
            border-color: var(--red);
            color: white;
        }

        /* =========================================================
           TOAST
        ========================================================= */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 8px;
            font-family: "Cinzel";
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }

        .toast.success {
            background: #1a4a2a;
            color: #b8e0b8;
            border: 1px solid #2a6a3a;
        }

        .toast.error {
            background: #4a1a1a;
            color: #e0b8b8;
            border: 1px solid #6a2a2a;
        }

        .toast.info {
            background: #1a2a4a;
            color: #b8c8e0;
            border: 1px solid #2a3a6a;
        }

        /* =========================================================
           CONTENEDOR PRINCIPAL DE DOCUMENTOS
        ========================================================= */
        .main-container {
            width: min(1300px, 94%);
            margin: 30px auto 50px;
        }

        .page-title {
            font-family: "Cinzel", serif;
            font-size: 28px;
            color: var(--paper);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-title small {
            font-size: 12px;
            color: #8e8373;
            font-weight: 400;
        }

        .page-title .count {
            font-size: 14px;
            color: var(--gold);
            font-weight: 400;
        }

        /* =========================================================
           FILTRO DE BÚSQUEDA
        ========================================================= */
        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: rgba(30, 28, 25, 0.8);
            border: 1px solid #4a3d2e;
            border-radius: 8px;
            padding: 15px 20px;
            align-items: center;
        }

        .search-bar input {
            flex: 1;
            background: #2a2722;
            border: 1px solid #4a3d2e;
            color: var(--paper);
            padding: 10px 16px;
            border-radius: 6px;
            font-family: "Libre Baskerville", serif;
            font-size: 13px;
            outline: none;
            min-width: 200px;
        }

        .search-bar input:focus {
            border-color: var(--gold);
        }

        .search-bar input::placeholder {
            color: #5f5446;
        }

        .search-bar .filter-count {
            color: #8e8373;
            font-size: 11px;
            font-family: "Montserrat", sans-serif;
            white-space: nowrap;
        }

        .search-bar .filter-count span {
            color: var(--gold);
            font-weight: 700;
        }

        /* =========================================================
           CONTENEDOR POR RANGO (separación)
        ========================================================= */
        .rank-section {
            margin-bottom: 40px;
        }

        .rank-section:last-child {
            margin-bottom: 0;
        }

        .rank-section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #4a3d2e;
        }

        .rank-section-header .rank-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .rank-section-header .rank-label {
            font-family: "Cinzel", serif;
            font-size: 16px;
            letter-spacing: 1px;
            color: var(--paper);
        }

        .rank-section-header .rank-count {
            font-size: 11px;
            color: #8e8373;
            font-family: "Montserrat", sans-serif;
            margin-left: auto;
        }

        /* =========================================================
           GRID DE TARJETAS (dentro de cada rango)
        ========================================================= */
        .rank-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        /* =========================================================
           TARJETA INDIVIDUAL
        ========================================================= */
        .document-card {
            background: #1f1c19;
            border: 2px solid #4a3d2e;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .document-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* Borde de rango (color) */
        .document-card[data-rank="Elite Urbana"] { border-color: var(--color-elite); }
        .document-card[data-rank="Caballero Lombardo"] { border-color: var(--color-caballero); }
        .document-card[data-rank="Infante Lombardo"] { border-color: var(--color-infante); }
        .document-card[data-rank="Paladín Lombardo"] { border-color: var(--color-paladin); }
        .document-card[data-rank="Pavesero Lombardo"] { border-color: var(--color-pavesero); }
        .document-card[data-rank="Milicia Urbana"] { border-color: var(--color-milicia); }
        .document-card[data-rank="Ballestero Genovés Condecorado"] { border-color: var(--color-ballestero); }
        .document-card[data-rank="Ciudadano"] { border-color: var(--color-ciudadano); }

        /* Insignia de rango (color de fondo) */
        .document-card .rank-badge {
            display: inline-block;
            font-size: 7px;
            font-family: "Cinzel", serif;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 3px;
            text-transform: uppercase;
            color: #1a1a1a;
            font-weight: 700;
        }

        .document-card[data-rank="Elite Urbana"] .rank-badge { background: var(--color-elite); color: #1a1a1a; }
        .document-card[data-rank="Caballero Lombardo"] .rank-badge { background: var(--color-caballero); color: white; }
        .document-card[data-rank="Infante Lombardo"] .rank-badge { background: var(--color-infante); color: white; }
        .document-card[data-rank="Paladín Lombardo"] .rank-badge { background: var(--color-paladin); color: white; }
        .document-card[data-rank="Pavesero Lombardo"] .rank-badge { background: var(--color-pavesero); color: white; }
        .document-card[data-rank="Milicia Urbana"] .rank-badge { background: var(--color-milicia); color: white; }
        .document-card[data-rank="Ballestero Genovés Condecorado"] .rank-badge { background: var(--color-ballestero); color: white; }
        .document-card[data-rank="Ciudadano"] .rank-badge { background: var(--color-ciudadano); color: white; }

        /* Contenedor de la foto (skin) */
        .card-skin {
            width: 100%;
            aspect-ratio: 1 / 0.9;
            background: #1a1715;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card-skin canvas {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
            object-fit: contain;
        }

        .card-skin .no-skin {
            color: #5f5446;
            font-size: 30px;
            opacity: 0.3;
        }

        /* Información de la tarjeta */
        .card-info {
            padding: 12px 14px 14px;
            text-align: center;
            background: #1f1c19;
            border-top: 1px solid #4a3d2e;
        }

        .card-info .card-name {
            font-family: "Cinzel", serif;
            font-size: 14px;
            color: var(--paper);
            letter-spacing: 0.5px;
        }

        .card-info .card-alias {
            font-size: 10px;
            color: #8e8373;
            font-style: italic;
            margin-top: 2px;
        }

        .card-info .card-rank {
            margin-top: 6px;
        }

        .card-info .card-actions {
            margin-top: 10px;
            display: flex;
            justify-content: center;
        }

        .card-info .btn-view {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 18px;
            border-radius: 4px;
            font-family: "Cinzel", serif;
            font-size: 8px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .card-info .btn-view:hover {
            background: var(--gold);
            color: #1a1a1a;
        }

        /* =========================================================
           ESTADO VACÍO
        ========================================================= */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #5f5446;
        }

        .empty-state i {
            font-size: 50px;
            color: #4a3d2e;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            font-family: "Cinzel", serif;
            color: #8e8373;
            font-size: 18px;
        }

        .empty-state p {
            font-size: 13px;
            margin-top: 8px;
        }

        /* =========================================================
           FOOTER
        ========================================================= */
        footer {
            text-align: center;
            color: #746b5e;
            font-size: 9px;
            padding: 30px;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */
        @media (max-width: 768px) {
            header {
                height: auto;
                padding: 15px 0;
            }
            .header-inner {
                flex-direction: column;
                gap: 12px;
            }
            .brand h1 {
                font-size: 16px;
            }
            nav a {
                font-size: 9px;
                padding: 6px 8px;
            }
            nav {
                gap: 8px;
                justify-content: center;
            }
            .page-title {
                font-size: 22px;
            }
            .search-bar {
                flex-direction: column;
                padding: 12px 15px;
            }
            .search-bar input {
                width: 100%;
            }
            .rank-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .card-info .card-name {
                font-size: 12px;
            }
            .card-info .card-alias {
                font-size: 9px;
            }
            .rank-section-header .rank-label {
                font-size: 14px;
            }
            .user-info .email {
                font-size: 8px;
            }
            .logout-btn {
                font-size: 8px;
                padding: 4px 10px;
            }
        }

        @media (max-width: 480px) {
            .rank-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .card-info {
                padding: 8px 8px 10px;
            }
            .card-info .card-name {
                font-size: 10px;
            }
            .card-info .card-alias {
                font-size: 8px;
            }
            .card-info .btn-view {
                font-size: 7px;
                padding: 4px 10px;
            }
            .card-skin {
                aspect-ratio: 1 / 0.85;
            }
            .page-title {
                font-size: 18px;
            }
            .page-title small {
                font-size: 10px;
            }
            .rank-section-header .rank-label {
                font-size: 12px;
            }
            .rank-section-header .rank-dot {
                width: 10px;
                height: 10px;
            }
            .rank-section {
                margin-bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         OVERLAY DE AUTENTICACIÓN
    ========================================================= -->
    <div class="auth-overlay" id="authOverlay">
        <div class="spinner"></div>
        <p>VERIFICANDO ACCESO...</p>
    </div>

    <!-- =========================================================
         CONTENIDO PRINCIPAL (oculto hasta autenticar)
    ========================================================= -->
    <div id="mainContent">

        <header>
            <div class="header-inner">
                <div class="brand">
                    <img src="./logo.png" alt="Logo">
                    <h1>LIGA LOMBARDA</h1>
                </div>
                <nav>
                    <a href="./index.html">INICIO</a>
                    <a href="./documentos.html" class="active">DOCUMENTOS</a>
                    <a href="./formulario.html">FORMULARIO</a>

                    <!-- USER INFO (se renderiza con JS) -->
                    <div id="userNav" style="display: none;">
                        <!-- Lo llena JavaScript -->
                    </div>
                </nav>
            </div>
        </header>

        <div class="main-container">

            <div class="page-title">
                <span><i class="fas fa-address-book" style="color:var(--gold);"></i> REGISTRO DE CIUDADANOS</span>
                <div>
                    <span class="count" id="totalCount">0</span>
                    <small>expedientes</small>
                </div>
            </div>

            <!-- Barra de búsqueda -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre, alias, nick, rango o número..." />
                <span class="filter-count" id="filterCount">Mostrando <span id="visibleCount">0</span> de <span id="totalVisible">0</span></span>
            </div>

            <!-- Grid de documentos (se renderiza por rangos) -->
            <div id="documentsContainer">
                <!-- Los rangos se renderizan con JavaScript -->
            </div>

        </div>

        <footer>
            Liga Lombarda · Archivo Central · Registro de Ciudadanos
        </footer>

    </div>

    <div id="toast" class="toast"></div>

    <!-- =========================================================
         SKINVIEW3D
    ========================================================= -->
    <script src="https://unpkg.com/skinview3d@3.4.2/bundles/skinview3d.bundle.js">
    </script>

    <!-- =========================================================
         SCRIPTS (módulo ES)
    ========================================================= -->
    <script type="module">
        // =========================================================
        // IMPORTS DE FIREBASE
        // =========================================================
        import { 
            auth, 
            onAuthStateChanged, 
            signOut,
            database,
            ref,
            get,
            onValue
        } from "./firebase-init.js";

        // Exponer Firebase para compatibilidad con el código existente
        window.firebaseDB = database;
        window.firebaseRef = ref;
        window.firebaseGet = get;
        window.firebaseOnValue = onValue;

        // =========================================================
        // REFERENCIAS DOM
        // =========================================================
        const authOverlay = document.getElementById('authOverlay');
        const mainContent = document.getElementById('mainContent');
        const userNav = document.getElementById('userNav');
        const toast = document.getElementById('toast');
        const documentsContainer = document.getElementById('documentsContainer');
        const searchInput = document.getElementById('searchInput');
        const totalCount = document.getElementById('totalCount');
        const visibleCount = document.getElementById('visibleCount');
        const totalVisible = document.getElementById('totalVisible');

        // =========================================================
        // TOAST
        // =========================================================
        function showToast(message, type = 'info', duration = 4000) {
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // Exponer showToast globalmente para el código existente
        window.showToast = showToast;

        // =========================================================
        // RENDERIZAR NAV
        // =========================================================
        function renderNav(user, isAdmin = false) {
            if (user) {
                userNav.style.display = 'flex';
                userNav.innerHTML = `
                    <span class="user-info">
                        <span class="email">
                            <i class="fas fa-user-circle"></i> ${user.email}
                            ${isAdmin ? '<span style="color:var(--gold);margin-left:4px;">👑</span>' : ''}
                        </span>
                        <button class="logout-btn" id="logoutBtnNav">
                            <i class="fas fa-sign-out-alt"></i> SALIR
                        </button>
                    </span>
                `;

                document.getElementById('logoutBtnNav').addEventListener('click', handleLogout);
            }
        }

        // =========================================================
        // VERIFICAR ADMIN
        // =========================================================
        async function checkIsAdmin(user) {
            if (!user) return false;
            try {
                const adminRef = ref(database, `usuarios/${user.uid}/admin`);
                const snapshot = await get(adminRef);
                return snapshot.val() === true;
            } catch (error) {
                console.warn('No se pudo verificar rol de admin:', error);
                return false;
            }
        }

        // =========================================================
        // LOGOUT
        // =========================================================
        async function handleLogout() {
            try {
                await signOut(auth);
                showToast('👋 Sesión cerrada correctamente', 'info', 2000);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 500);
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
                showToast('❌ Error al cerrar sesión', 'error', 3000);
            }
        }

        // =========================================================
        // OBSERVER DE AUTENTICACIÓN
        // =========================================================
        onAuthStateChanged(auth, async (user) => {
            // Ocultar overlay
            authOverlay.classList.add('hidden');

            if (!user) {
                // ❌ NO LOGUEADO → Redirigir a login
                showToast('🔐 Debes iniciar sesión para ver los documentos', 'error', 2000);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 500);
                return;
            }

            // ✅ USUARIO LOGUEADO → Mostrar contenido
            const isAdmin = await checkIsAdmin(user);
            
            // Mostrar contenido
            mainContent.classList.add('visible');
            
            // Renderizar nav
            renderNav(user, isAdmin);

            // Cargar documentos
            cargarDocumentos();

            showToast(`✅ Bienvenido, ${user.email}`, 'success', 2000);

            console.log(`📄 Documentos - Usuario: ${user.email}`);
            console.log(`👑 Rol: ${isAdmin ? 'admin' : 'normal'}`);
        });

        // =========================================================
        // ORDEN DE RANGOS
        // =========================================================
        const RANK_ORDER = [
            'Elite Urbana',
            'Caballero Lombardo',
            'Infante Lombardo',
            'Paladín Lombardo',
            'Pavesero Lombardo',
            'Milicia Urbana',
            'Ballestero Genovés Condecorado',
            'Ciudadano'
        ];

        const RANK_COLORS = {
            'Elite Urbana': '#FFD700',
            'Caballero Lombardo': '#CC0000',
            'Infante Lombardo': '#933581',
            'Paladín Lombardo': '#855C88',
            'Pavesero Lombardo': '#028589',
            'Milicia Urbana': '#BC4E00',
            'Ballestero Genovés Condecorado': '#10A1C3',
            'Ciudadano': '#888888'
        };

        // =========================================================
        // CARGAR SKIN EN CANVAS (con skinview3d)
        // =========================================================
        function cargarSkinEnCanvas(canvas, skinURL, poseData = null) {
            if (typeof skinview3d === 'undefined') {
                setTimeout(() => cargarSkinEnCanvas(canvas, skinURL, poseData), 300);
                return;
            }

            try {
                const viewer = new skinview3d.SkinViewer({
                    canvas: canvas,
                    width: 300,
                    height: 270
                });

                viewer.fov = 30;
                viewer.zoom = 1.0;
                viewer.autoRotate = false;
                viewer.controls.enableRotate = false;
                viewer.controls.enableZoom = false;
                viewer.controls.enablePan = false;
                viewer.globalLight.intensity = 2.5;
                viewer.cameraLight.intensity = 1.2;

                viewer.loadSkin(skinURL).then(() => {
                    if (poseData && viewer.playerObject && viewer.playerObject.skin) {
                        const skin = viewer.playerObject.skin;
                        Object.keys(poseData).forEach(key => {
                            const [part, axis] = key.split('.');
                            if (skin[part]) {
                                skin[part].rotation[axis] = poseData[key];
                            }
                        });
                        viewer.render();
                    }
                }).catch(() => {
                    // Skin no encontrada, mostrar placeholder
                    console.warn('Error cargando skin para:', skinURL);
                });

            } catch (error) {
                console.warn('Error al renderizar skin:', error);
            }
        }

        // =========================================================
        // VER EXPEDIENTE
        // =========================================================
        function verExpediente(id) {
            // Redirige a la vista detalle con el ID
            window.location.href = `expediente.html?id=${id}`;
        }
        window.verExpediente = verExpediente;

        // =========================================================
        // RENDERIZAR POR RANGOS
        // =========================================================
        function renderizarPorRangos(expedientes, searchTerm = '') {
            const searchLower = searchTerm.toLowerCase().trim();

            // Convertir a array
            let items = Object.keys(expedientes).map(key => ({
                id: key,
                ...expedientes[key]
            }));

            // Filtrar por búsqueda
            if (searchLower) {
                items = items.filter(item => {
                    const name = (item.name || '').toLowerCase();
                    const alias = (item.alias || '').toLowerCase();
                    const nick = (item.minecraftNick || '').toLowerCase();
                    const rank = (item.rank || '').toLowerCase();
                    const fileNumber = (item.fileNumber || '').toLowerCase();
                    return name.includes(searchLower) ||
                        alias.includes(searchLower) ||
                        nick.includes(searchLower) ||
                        rank.includes(searchLower) ||
                        fileNumber.includes(searchLower);
                });
            }

            // Agrupar por rango
            const grupos = {};
            items.forEach(item => {
                const rank = item.rank || 'Ciudadano';
                if (!grupos[rank]) grupos[rank] = [];
                grupos[rank].push(item);
            });

            // Ordenar los rangos según RANK_ORDER
            const rangosOrdenados = RANK_ORDER.filter(r => grupos[r] && grupos[r].length > 0);

            // Actualizar contadores
            totalCount.textContent = Object.keys(expedientes).length;
            visibleCount.textContent = items.length;
            totalVisible.textContent = items.length;

            if (items.length === 0) {
                documentsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-address-book"></i>
                        <h3>${searchLower ? 'No se encontraron resultados' : 'No hay expedientes registrados'}</h3>
                        <p>${searchLower ? 'Intenta con otro término de búsqueda' : 'Completa el formulario para crear el primer expediente'}</p>
                    </div>
                `;
                return;
            }

            // Generar HTML por rangos
            let html = '';
            rangosOrdenados.forEach(rank => {
                const itemsDelRango = grupos[rank];
                const color = RANK_COLORS[rank] || '#888888';

                html += `
                    <div class="rank-section">
                        <div class="rank-section-header">
                            <span class="rank-dot" style="background:${color};"></span>
                            <span class="rank-label">${rank}</span>
                            <span class="rank-count">${itemsDelRango.length} ciudadano${itemsDelRango.length > 1 ? 's' : ''}</span>
                        </div>
                        <div class="rank-grid">
                `;

                itemsDelRango.forEach(item => {
                    const name = item.name || 'Sin nombre';
                    const alias = item.alias || 'Sin alias';
                    const nick = item.minecraftNick || '';
                    const poseValues = item.pose?.values || null;

                    let poseDataAttr = '';
                    if (poseValues) {
                        poseDataAttr = `data-pose='${JSON.stringify(poseValues)}'`;
                    }

                    const skinURL = nick ? `https://mc-heads.net/skin/${encodeURIComponent(nick)}.png` : null;

                    html += `
                        <div class="document-card" data-rank="${rank}" data-id="${item.id}" ${poseDataAttr}>
                            <div class="card-skin">
                                ${skinURL ? 
                                    `<canvas id="skinCanvas_${item.id}" data-skin="${skinURL}"></canvas>` :
                                    `<div class="no-skin"><i class="fas fa-user"></i></div>`
                                }
                            </div>
                            <div class="card-info">
                                <div class="card-name">${name}</div>
                                <div class="card-alias">"${alias}"</div>
                                <div class="card-rank">
                                    <span class="rank-badge">${rank}</span>
                                </div>
                                <div class="card-actions">
                                    <button class="btn-view" onclick="verExpediente('${item.id}')">
                                        <i class="fas fa-eye"></i> VER
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            documentsContainer.innerHTML = html;

            // Cargar skins
            setTimeout(() => {
                document.querySelectorAll('.card-skin canvas').forEach(canvas => {
                    const skinURL = canvas.dataset.skin;
                    if (skinURL) {
                        const card = canvas.closest('.document-card');
                        let poseData = null;
                        if (card) {
                            try {
                                const poseAttr = card.dataset.pose;
                                if (poseAttr) {
                                    poseData = JSON.parse(poseAttr);
                                }
                            } catch (e) {}
                        }
                        cargarSkinEnCanvas(canvas, skinURL, poseData);
                    }
                });
            }, 200);
        }

        // =========================================================
        // CARGAR DOCUMENTOS DESDE FIREBASE
        // =========================================================
        function cargarDocumentos() {
            const expedientesRef = ref(database, 'expedientes');

            onValue(expedientesRef, (snapshot) => {
                const firebaseData = snapshot.val() || {};
                renderizarPorRangos(firebaseData, searchInput.value);
            }, (error) => {
                console.error('Error al cargar documentos:', error);
                showToast('❌ Error al cargar los documentos', 'error', 3000);
            });
        }

        // =========================================================
        // BÚSQUEDA EN TIEMPO REAL
        // =========================================================
        let searchTimeout = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const expedientesRef = ref(database, 'expedientes');
                get(expedientesRef).then((snapshot) => {
                    const firebaseData = snapshot.val() || {};
                    renderizarPorRangos(firebaseData, searchInput.value);
                });
            }, 300);
        });

        console.log('📄 Página de documentos con autenticación obligatoria');
    </script>

</body>
